<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>grokslut</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 900px; margin: 3rem auto; padding: 0 1rem; background: #101218; color: #eceef4; }
    button { cursor: pointer; background: #6750a4; color: #fff; border: 0; border-radius: .4rem; padding: .55rem .8rem; font: inherit; }
    button.alt { background: #30333d; }
    input[type="search"] { flex: 1; min-width: 12rem; background: #101218; color: #eceef4; border: 1px solid #4a4f5d; border-radius: .4rem; padding: .55rem .7rem; font: inherit; }
    section { background: #1c1f27; border-radius: .75rem; padding: 1rem 1.25rem; margin: 1rem 0; }
    details { padding: .6rem; border-bottom: 1px solid #343843; }
    .chat { display: flex; gap: .6rem; padding: .45rem; }
    .chat label { flex: 1; cursor: pointer; }
    .conversation-toolbar { position: sticky; top: .5rem; z-index: 10; background: #262a34; border: 1px solid #3b404d; border-radius: .65rem; padding: .75rem; margin-bottom: .75rem; box-shadow: 0 .4rem 1.2rem #0008; }
    .filter-row, .export-row { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem; }
    #export { border-top: 1px solid #3b404d; margin-top: .75rem; padding-top: .75rem; }
    #selected { margin-right: auto; }
    #result { max-height: 8rem; overflow: auto; margin-top: .5rem; }
    .muted { color: #b6bac7; font-size: .9rem; }
    .warning { color: #ffcc80; }
    .hidden { display: none; }
    #export-progress { width: 100%; accent-color: #9b7de0; }
    a { color: #cbb9ff; }
  </style>
  <body>
    <h1>grokslut</h1>
    <p class="muted">Local-only Grok conversation export.</p>
    <section>
      <h2>Browser session</h2>
      <p id="status">Checking the shared session…</p>
      <div id="connect" class="hidden">
        <p>Sign in normally at <a href="https://grok.com/" target="_blank">Grok</a>, then click <strong>Sync Grok session</strong> in the unpacked grokslut extension.</p>
      </div>
      <button class="alt hidden" id="logout">Clear local session</button>
    </section>
    <section id="chats" class="hidden">
      <h2>Conversations</h2>
      <div class="conversation-toolbar">
        <div class="filter-row">
          <input id="filter" type="search" placeholder="Filter conversations or projects…" aria-label="Filter conversations">
          <button class="alt" id="refresh">Refresh</button>
          <span id="filter-count" class="muted"></span>
        </div>
        <div id="export" class="hidden">
          <div class="export-row">
            <span id="selected"></span>
            <button data-format="markdown">Markdown + media</button>
            <button data-format="json">JSON</button>
            <button data-format="zip">ZIP bundle</button>
          </div>
          <div id="progress" class="hidden">
            <p id="progress-label" class="muted">Preparing export…</p>
            <progress id="export-progress"></progress>
          </div>
          <div id="result"></div>
        </div>
      </div>
      <div id="tree"></div>
    </section>
    <script>
      const $ = (selector) => document.querySelector(selector);
      const selected = new Set();
      async function api(path, options) {
        const response = await fetch(path, options);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        return data;
      }
      function updateSelection() {
        const count = selected.size;
        $("#selected").textContent = count + " conversation" + (count === 1 ? "" : "s") + " selected.";
        $("#export").classList.toggle("hidden", !count);
      }
      function conversationRow(conversation, projectTitle) {
        const row = document.createElement("div");
        row.className = "chat";
        row.dataset.search = [conversation.title, conversation.preview, conversation.id, projectTitle].filter(Boolean).join(" ").toLocaleLowerCase();
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = selected.has(conversation.id);
        box.addEventListener("change", () => {
          box.checked ? selected.add(conversation.id) : selected.delete(conversation.id);
          updateSelection();
        });
        const label = document.createElement("label");
        label.textContent = conversation.title || "Untitled conversation";
        label.addEventListener("click", () => { box.checked = !box.checked; box.dispatchEvent(new Event("change")); });
        const date = document.createElement("span");
        date.className = "muted";
        date.textContent = conversation.updatedAt || "";
        row.append(box, label, date);
        return row;
      }
      function applyFilter() {
        const term = $("#filter").value.trim().toLocaleLowerCase();
        let shown = 0;
        let total = 0;
        document.querySelectorAll("#tree details").forEach((branch) => {
          const projectMatches = branch.querySelector("summary").textContent.toLocaleLowerCase().includes(term);
          let branchShown = 0;
          branch.querySelectorAll(".chat").forEach((row) => {
            const matches = !term || projectMatches || row.dataset.search.includes(term);
            row.classList.toggle("hidden", !matches);
            total++;
            if (matches) { shown++; branchShown++; }
          });
          branch.classList.toggle("hidden", branchShown === 0);
          if (term && branchShown) branch.open = true;
        });
        $("#filter-count").textContent = term ? shown + " of " + total : total + " conversations";
      }
      async function loadConversations() {
        const groups = await api("/api/conversations");
        const tree = $("#tree");
        tree.replaceChildren();
        for (const group of groups) {
          const branch = document.createElement("details");
          branch.open = true;
          const title = document.createElement("summary");
          title.textContent = group.title + " (" + group.conversations.length + ")";
          branch.append(title, ...group.conversations.map((conversation) => conversationRow(conversation, group.title)));
          tree.append(branch);
        }
        applyFilter();
        $("#chats").classList.remove("hidden");
      }
      async function loadStatus() {
        const state = await api("/api/status");
        $("#status").textContent = state.authenticated ? "Connected to your shared local Grok session." : "No Grok session is connected.";
        $("#connect").classList.toggle("hidden", state.authenticated);
        $("#logout").classList.toggle("hidden", !state.authenticated);
        if (state.authenticated) await loadConversations();
      }
      function showProgress(progress) {
        const bar = $("#export-progress");
        const labels = { loading: "Loading conversation", responses: "Loading messages", writing: "Writing files" };
        $("#progress").classList.remove("hidden");
        $("#progress-label").textContent = (labels[progress.phase] || progress.phase) + ": " + progress.current + " / " + progress.total;
        bar.max = Math.max(progress.total, 1);
        bar.value = progress.current;
      }
      async function exportSelected(format) {
        const response = await fetch("/api/export-stream", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ids: [...selected], format }) });
        if (!response.ok) {
          const data = await response.json();
          throw new Error(data.error);
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let result;
        while (true) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
          const lines = buffer.split("\n");
          buffer = lines.pop();
          for (const line of lines) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (event.type === "progress") showProgress(event.progress);
            if (event.type === "error") throw new Error(event.error);
            if (event.type === "result") result = event.result;
          }
          if (done) break;
        }
        if (!result) throw new Error("Export ended without a result");
        return result;
      }
      $("#logout").addEventListener("click", async () => {
        await api("/api/logout", { method: "POST" });
        selected.clear(); updateSelection(); $("#chats").classList.add("hidden"); await loadStatus();
      });
      $("#filter").addEventListener("input", applyFilter);
      $("#refresh").addEventListener("click", () => loadConversations().catch((error) => alert(error.message)));
      document.querySelectorAll("[data-format]").forEach((button) => button.addEventListener("click", async () => {
        const buttons = [...document.querySelectorAll("[data-format]")];
        try {
          buttons.forEach((item) => item.disabled = true);
          $("#result").replaceChildren();
          $("#progress").classList.remove("hidden");
          $("#progress-label").textContent = "Preparing export…";
          $("#export-progress").removeAttribute("value");
          const result = await exportSelected(button.dataset.format);
          const output = $("#result"); output.replaceChildren();
          for (const path of result.paths) {
            const link = document.createElement("a");
            link.href = "/files/" + path.split("/").map(encodeURIComponent).join("/");
            link.textContent = "Download " + path; link.style.display = "block"; output.append(link);
          }
          for (const warning of result.warnings || []) { const line = document.createElement("p"); line.className = "warning"; line.textContent = warning; output.append(line); }
          $("#progress-label").textContent = "Export complete.";
          $("#export-progress").value = $("#export-progress").max;
        } catch (error) { alert(error.message); }
        finally { buttons.forEach((item) => item.disabled = false); }
      }));
      loadStatus().catch((error) => { $("#status").textContent = error.message; });
    </script>
  </body>
</html>
